<script>const D=[{"date": "2026-10-20", "items": [{"slug": "ai-creator", "name": "크리에이터 인턴", "rep": {"branch": "A. AI 캐릭터들과 노는 나", "headline": "A갈래는 보류: 같은 포맷의 성장 사례를 못 찾음", "news": [], "tried": {"what": "갈래 A 근거표 만들기: 비슷한 포맷 사례, 인스타 AI 라벨 규정, 다혜 손 시간 추정, 어필리에이트 단가 4곳 미리 정리", "result": "'사람+AI 캐릭터 스킷' 계정이 6개월 안에 1만+ 된 사례는 못 찾았습니다(근거 부족이지 반증은 아닙니다). 찾은 건 Character.AI 공식 계정과 사람 없는 AI 페르소나뿐이고, 모두 2차 자료라 숫자는 미확인입니다. 인스타가 8/31 'AI-generated profile' 라벨 규정을 발표했는데, 사람 얼굴이 주인공인 스킷이 대상인지는 아직 확인 못 했습니다. 손 시간은 추측으로 편당 약 90분이고, 위임하면 약 30분입니다.", "file": "작업실/ai-creator/2026-10-20 A갈래 근거표.md"}, "next": "갈래 B(바이럴 AI 영상 따라 만들기): 최근 바이럴 영상 10개를 다혜 손 시간 기준(촬영 없음 / 10분 / 본격)으로 분류하고, 따라 만든 계정의 성장을 확인합니다.", "ask": "", "orders_done": "", "progress": "큰 AI 크리에이터 0/10 · 포맷 0/10 · 어필리에이트 단가 4/10(공식 확인 전) · 2주 실험안 0/1 · 갈래 판정 1/5(A 보류) · 기울기 보류(약한 기준: 돈). 최근 7일 안의 새 소식은 찾지 못해서 비웠습니다.", "metrics": "@dahey.ai 팔로워 115 · 게시물 2"}}, {"slug": "kbeauty-foreigners", "name": "K뷰티 서비스 인턴", "rep": {"branch": "A. 올리브영·뷰티 투어", "headline": "뷰티 투어는 시간당 10만 원대 가격이 실제로 있음", "news": [{"title": "정부 K-뷰티 대책: 유치기관 비자 신속발급 요건을 연 500건에서 200건으로 완화, 2028년까지 K헬스케어 통합 허브 구축", "why": "외국인 환자 유치 쪽 규제가 풀리는 방향이라는 신호입니다. 다만 유치업 등록 요건이 바뀐다는 말은 기사에 없습니다.", "url": "https://www.khan.co.kr/article/202610140742001/amp", "date": "2026-10-14"}], "tried": {"what": "뷰티 투어 가격표 만들기: 국내외 상품 6개 가격, 후기 수, 등록 필요 여부를 조사했습니다.", "result": "서울신문 기사에서 국내 뷰티 투어가 2~8시간에 20만~100만 원이었습니다. 시간당 환산하면 10만 원대로, 다혜 메모의 '시간당 10만 원'과 맞습니다. 개인 가이드 한 명이 입소문만으로 3개월에 100명 넘게 모았다는 사례도 있습니다. 해외 사이트 판매가는 약 2시간에 $350인데, 후기 수는 403 오류로 못 봤습니다. 올리브영이 무료 가이드를 시범 운영한 적이 있어 가격이 눌릴 수 있고, 시술 동행이 들어가면 유치업 경계에 걸립니다.", "file": "작업실/kbeauty-foreigners/2026-10-20 A갈래 뷰티투어 가격·공급 조사.md"}, "next": "갈래 B(영어 시술 정보 채널)를 판다. 레딧·텔레그램의 영어 K시술 채널 규모와 수익 방식을 조사하고, 의료광고 규제에 걸리는지 확인한다. 못 본 마이리얼트립·클룩 후기 수는 다음 A 차례에 채운다.", "ask": "", "orders_done": "", "progress": "경쟁 서비스 약 10/15(이전 4곳 + 오늘 6개 상품, 같은 업체 중복 가능) · 등록 요건 2차 자료만(법령 원문 미확인) · 손님 1명당 수익 1장(가정값) · 2주 실험안 잠정 1개 · 갈래 판정 2/6(A 보류·키울 만함 쪽, D 보류) · 기울기 보류(약한 기준: 구조·돈), 가장 유망한 갈래 A(잠정)"}}, {"slug": "beauty-brand", "name": "뷰티 브랜드 인턴", "rep": {"branch": "A. 해외향 한국 헤어 브랜드", "headline": "한국 헤어 브랜드 '없다'는 전제는 틀림, 두피케어는 이미 경쟁", "news": [], "tried": {"what": "미국 K헤어 브랜드 현황 조사표 작성 (Kundal·Dr.Forhair·두피케어 시장·본드 리페어 경쟁)", "result": "Kundal은 코스트코·타깃·아마존에, Dr.Forhair는 세포라에 이미 입점해 있고, Circana는 두피케어가 헤어 성장 1위라고 합니다. 본드 리페어(올라플렉스류) 쪽은 K18 등 비한국 브랜드만 확인됐고 한국 브랜드 빈자리는 가능성 수준입니다. 아마존·틱톡샵 헤어 순위, 리뷰 불만, 가격은 못 찾았습니다. 울타 K헤어 13개 브랜드 추가는 원문을 확인하지 못했습니다.", "file": "작업실/beauty-brand/2026-10-20 A갈래 미국 K헤어 브랜드 현황 조사표.md"}, "next": "갈래 B: 히스패닉·흑인 대상 PIH·시술 후 케어 제품의 브랜드와 가격 조사. 이후 A의 아마존 베스트셀러 직접 확인.", "ask": "", "orders_done": "", "progress": "후보 비교 1/3 · ODM 0/3 · 빈자리 근거 A갈래 일부 · 2주 실험안 0/1 · 갈래 판정 1/6(A 보류) · 기울기 보류(약한 기준: 돈) · 최근 7일 안에 날짜가 확인된 소식은 없어 news는 비웠습니다"}}, {"slug": "idea-scout", "name": "정찰 인턴", "rep": {"branch": "", "headline": "1번 상황별 영어표현 앱: 보류 (시장은 큼, 고객 정의 약함)", "news": [], "tried": {"what": "1번 영어표현 앱의 비슷한 서비스 조사표를 만들고 판정서를 처음 작성했습니다.", "result": "Duolingo(2025 매출 약 $1.04B), Praktika(ARR 약 $20M), Speak(ARR $100M 이상)로 시장은 큽니다. 다만 모두 2차 자료라 확인 수준이 약하고, 가장 가까운 한국 경쟁 Cake는 매출을 못 찾았습니다. 다혜 메모에는 고객 정의가 없어서 '고객' 기준이 약하고, 앱 개발 전에 콘텐츠로 먼저 수요를 볼 수 있어 보류로 두었습니다.", "file": "작업실/idea-scout/2026-10-20 1번 영어표현 앱 경쟁 비교표.md"}, "next": "2번 비자·유학 컨설팅·ODM 중개 장사 정찰. 1번의 빈칸인 Cake 가격·매출은 앱스토어 공개 페이지로 보충합니다.", "ask": "", "orders_done": "", "progress": "판정 1/14 · 키울 만함 0 · 전담 인턴 추천 0 · 기울기 1번 보류(약한 기준: 고객, 돈). 최근 7일 안의 확인 가능한 소식은 못 찾아 news는 비웠습니다."}}, {"slug": "kbeauty-magazine", "name": "매거진 인턴", "rep": {"branch": "A. 병원·더마급 한국 스킨케어", "headline": "더마급은 광고 수요는 맞지만 협찬 실적은 아직 못 봄", "news": [], "tried": {"what": "갈래 A(더마급) 근거표를 만들고 판정서를 처음 작성했습니다.", "result": "Meta 미국 K뷰티 광고비 2년 7.3배(2026-09-18, 직접 확인)와 Dr.G·Medicube의 미국 마케팅 사례까지 찾았습니다. 하지만 인스타와 Meta 광고 라이브러리를 열 수 없어서 계정 10개, 광고주 30개 숫자는 못 채웠습니다. 더마급은 IDENEL과 겹칠 위험이 있다고 판정서에 적었습니다.", "file": "작업실/kbeauty-magazine/2026-10-20 갈래A 더마급 니치 근거표.md"}, "next": "갈래 B(30대+ 안티에이징): @seoulbeautyclub 같은 계정 10개의 팔로워와 최근 광고 표시를 확인하고, 안 열리면 공개 미디어킷을 찾아 광고주를 셉니다.", "ask": "", "orders_done": "", "progress": "계정 0/40 · 광고주 명단 0/30 · 갈래 판정 1/4(A 보류) · 기울기 보류(가장 약한 기준: 돈). 7일 안 날짜가 확인되는 새 소식은 못 찾아서 소식은 비웠습니다."}}]}];const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(i){const d=D[i];document.getElementById("sub").textContent=d.date+" · 인턴 "+d.items.length+"명";
document.querySelectorAll("nav button").forEach((b,j)=>b.classList.toggle("on",j==i));
document.getElementById("list").innerHTML=d.items.map(x=>{const r=x.rep||{},t=r.tried||{};if(x.error)return`<div class="c"><h2>${esc(x.name)}</h2><div class="f">오늘 결근 (오류): ${esc(x.error)}</div></div>`;
return`<div class="c"><h2>${esc(x.name)}</h2><div class="hl">${esc(r.headline)}</div>
${r.ask?`<div class="ask">물어볼 것: ${esc(r.ask)}</div>`:""}
<h3>소식</h3><ul>${(r.news||[]).map(n=>`<li><b>${esc(n.title)}</b> <span class="f">${esc(n.date)}</span><br>${esc(n.why)}<br><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a></li>`).join("")}</ul>
<h3>해본 것</h3><div>${esc(t.what)}</div><div>${esc(t.result)}</div><div class="f">결과물: ${esc(t.file)} (금고)</div>
${r.metrics?`<h3>계정 숫자</h3><div>${esc(r.metrics)}</div>`:""}${r.progress?`<h3>목표 진척</h3><div>${esc(r.progress)}</div>`:""}<h3>다음에 할 것</h3><div>${esc(r.next)}</div>${r.orders_done?`<h3>지시 반영</h3><div>${esc(r.orders_done)}</div>`:""}</div>`}).join("")}
document.getElementById("nav").innerHTML=D.map((d,i)=>`<button onclick="show(${i})">${d.date.slice(5)}</button>`).join("");show(0);</script></body></html>
