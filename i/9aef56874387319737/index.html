<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이디어 인턴</title><style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;--accent:#3a5bd9;--warn:#b5541b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--mute:#9a9992;--line:#33322f;--accent:#8ea6ff;--warn:#f0a070}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin-bottom:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.c h2{font-size:16px;margin:0 0 2px}.hl{font-weight:600;margin:4px 0 10px}h3{font-size:13px;color:var(--mute);margin:12px 0 4px;font-weight:600}
ul{margin:0;padding-left:18px}li{margin:4px 0}a{color:var(--accent);word-break:break-all}.ask{color:var(--warn);font-weight:600}.f{color:var(--mute);font-size:13px}
</style></head><body><main><h1>아이디어 인턴 보고</h1><div class="sub" id="sub"></div><nav id="nav"></nav><div id="list"></div></main>
<script>const D=[{"date": "2026-10-20", "items": [{"slug": "kbeauty-foreigners", "name": "K뷰티 서비스 인턴", "rep": {"headline": "유치업 등록은 법인·자본금 1억 필요, 1인 가능 여부는 미확인 → 보류", "news": [{"title": "강남구, 인도네시아 뷰티박람회서 의료관광 상담 117건, 계약 약 80만 9천 달러 전망", "date": "2026-10-16", "why": "지자체가 해외 여행사와 12건 MOU를 맺고 있어, 유치 채널이 이미 기관 중심으로 짜이고 있음을 보여줍니다. 1인이 끼어들 틈이 좁다는 신호일 수 있습니다.", "url": "https://www.koreapost.co.kr/news/articleView.html?idxno=89563"}, {"title": "부산 서구 의료관광축제, 해외 바이어·국내 유치업체 교류회 (1:1 상담 24건)", "date": "2026-10-19", "why": "지방 병원들도 유치업체와 직접 연결되는 자리를 만들고 있습니다. 서울 밖 유치 수요가 있다는 참고 신호입니다.", "url": "https://www.gukjenews.com/news/articleView.html?idxno=3726138"}], "tried": {"what": "유치업 등록 요건·수수료 상한·경쟁 4곳 확인, 손님 1명당 수익 가정표 작성, 판정서 첫 작성", "result": "등록 요건은 자본금 1억(종합여행업이면 5천만), 보증보험, 국내 사무소이고, 수수료 상한은 의원급 30%입니다. 다만 법령 원문은 열지 못해 블로그·변호사 칼럼 기준이고, 개인 등록 가능 여부와 겸업 가능 여부는 어디에도 없었습니다. 수익표는 가정값(1명당 순수익 8만~87만 원)이며 실제 시세 근거는 아직 없습니다.", "file": "작업실/kbeauty-foreigners/2026-10-20 유치업 등록 요건·수수료 상한·1명당 수익.md"}, "next": "국가법령정보센터에서 시행규칙 원문을 대조하고 개인·겸업 가능 여부와 온라인 홍보(영어 랜딩·텔레그램)가 광고 규제에 걸리는지 확인한 뒤, 경쟁 서비스를 4곳에서 늘려 수수료 방식을 채웁니다.", "ask": "", "orders_done": "", "progress": "경쟁 4/15 · 등록 요건 1/1(2차 자료, 원문 대조 필요) · 1명당 수익표 1/1(가정값) · 2주 실험안 1/1(잠정) · 기울기 보류(약한 기준: 구조·돈)"}}]}];const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(i){const d=D[i];document.getElementById("sub").textContent=d.date+" · 인턴 "+d.items.length+"명";
document.querySelectorAll("nav button").forEach((b,j)=>b.classList.toggle("on",j==i));
document.getElementById("list").innerHTML=d.items.map(x=>{const r=x.rep||{},t=r.tried||{};if(x.error)return`<div class="c"><h2>${esc(x.name)}</h2><div class="f">오늘 결근 (오류): ${esc(x.error)}</div></div>`;
return`<div class="c"><h2>${esc(x.name)}</h2><div class="hl">${esc(r.headline)}</div>
${r.ask?`<div class="ask">물어볼 것: ${esc(r.ask)}</div>`:""}
<h3>소식</h3><ul>${(r.news||[]).map(n=>`<li><b>${esc(n.title)}</b> <span class="f">${esc(n.date)}</span><br>${esc(n.why)}<br><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a></li>`).join("")}</ul>
<h3>해본 것</h3><div>${esc(t.what)}</div><div>${esc(t.result)}</div><div class="f">결과물: ${esc(t.file)} (금고)</div>
${r.metrics?`<h3>계정 숫자</h3><div>${esc(r.metrics)}</div>`:""}${r.progress?`<h3>목표 진척</h3><div>${esc(r.progress)}</div>`:""}<h3>다음에 할 것</h3><div>${esc(r.next)}</div>${r.orders_done?`<h3>지시 반영</h3><div>${esc(r.orders_done)}</div>`:""}</div>`}).join("")}
document.getElementById("nav").innerHTML=D.map((d,i)=>`<button onclick="show(${i})">${d.date.slice(5)}</button>`).join("");show(0);</script></body></html>
