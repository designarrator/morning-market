*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

 letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:anywhere;

h1,h2,h3,h4,p{margin:0}
h1{font-size:24px;line-height:34px;font-weight:700;letter-spacing:-0.02em}
h2{font-size:24px;line-height:34px;font-weight:700;letter-spacing:-0.02em}
h3{font-size:17px;line-height:27px;font-weight:700;letter-spacing:-0.02em}
h4{font-size:13px;line-height:19px;font-weight:600;color:var(--sub)}
small,.cap,.note{font-size:13px;line-height:19px}
.cap{color:var(--weak)} .note{color:var(--sub)} .sub{color:var(--sub)}
.big{font-size:24px;line-height:34px;font-weight:700;letter-spacing:-0.02em}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
a{color:var(--pri);text-decoration:none}

button,a,summary{-webkit-tap-highlight-color:transparent}
button:active,a:active,summary:active{transform:scale(.97);transition:transform .1s}
details>summary{cursor:pointer;list-style:none;color:var(--pri);font-size:13px;line-height:19px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";} details[open]>summary::before{content:"▾ ";}
ul{margin:0;padding-left:20px}
.card{background:var(--card);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:12px}
.in{background:var(--subtle);border-radius:var(--r-btn);padding:12px 16px}
.chip{display:inline-block;font-size:13px;line-height:19px;font-weight:600;border-radius:var(--r-chip);padding:4px 8px;background:var(--subtle);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--pri-s);color:var(--pri)} .chip.bad{background:var(--up-s);color:var(--up)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:8px}
.rank{display:flex;flex-direction:column;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:8px;background:var(--weak);vertical-align:2px}
.dot.lead{background:var(--pri)}
.chart{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:stretch}
.chart svg{width:100%;height:180px;display:block}
.ends{position:relative}
.ends small{position:absolute;left:0;transform:translateY(-50%);color:var(--sub);white-space:nowrap}
.ends small.lead{color:var(--pri);font-weight:600}
.bar{position:relative;height:8px;border-radius:999px;background:var(--subtle);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:999px}
.bar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--weak)}
.test{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.test:first-child{border-top:0;padding-top:0}
.warn{color:var(--up);font-weight:600}
.pos{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}

 한 종목이고, VOO 안에도 BRK-B가 일부 들어 있어 실제로는 조금 더 커요. 같은 회사에 두 사람이 몰리지만 변동성이 낮은(1년 14.6%) 회사라 거부할 수준은 아니에요. 원자재 PDBC는 달리오 5,809원에 이번 매수 20,000원이 더해져 약 2.6만 원이 돼요. 펼친 표에는 대부분 IUGXX(초단기 국채 펀드, 13.0%)로 나와 '현금처럼 안전해' 보이지만, 실제로는 기름·곡물·금속 선물의 위험을 그대로 지고 있다는 점을 알아 둬야 해요. 그 밖에 실리콘투 한 종목이 18.5%(린치 포트폴리오의 절반쯤)이고, 금리에 민감한 TLT·IEF가 합쳐 18.4%예요. 금리가 더 오르면 이 둘이 함께 흔들려요.", "warnings": ["드러켄밀러: PDBC는 52주 최고가 근처(위치 99%)에서 사는 추세 추종 매수예요. 원자재는 방향이 바뀌면 빠르게 떨어져요(1년 최대 낙폭 -16.6%). 손절 기준을 미리 정해 두세요.", "드러켄밀러: 관점에 나온 유가 '약 99달러', QQQ 1개월 -3.0%와 1년 변동성 19.8%는 팩트 시트에 없는 숫자예요. 주문을 바로 받치는 근거는 아니라서 거부하지 않았지만, 확인이 필요해요.", "드러켄밀러 채점: 1022-2가 '맞음'으로 되어 있지만, 판별 기준이 여기 주어지지 않아 너그럽게 채점됐는지 확인할 수 없어요. 확인이 필요해요.", "버핏: 'S&P 500 PER 24.2배(이익수익률 약 4.1%)'는 거시 지표나 팩트 시트에 없는 숫자예요. 관점에만 쓰였고 주문은 없지만, 확인이 필요해요.", "린치: 실리콘투(257720.KQ)가 1개월 -26.4%예요. 한 종목이 포트폴리오의 약 절반이라, 더 사기 전에 '이야기가 그대로인지'(수출 숫자 등)부터 확인하세요.", "4명 전체: 원자재(PDBC)와 금(GLD)처럼 물가 상승에 거는 쪽과, 국채(TLT·IEF)처럼 물가가 내려야 오르는 쪽이 함께 있어요. 물가가 계속 오르면(소비자물가 3.4→3.7%) 국채 쪽이 손실을 낼 수 있어요."], "vetoes": [], "date": "2026-10-23"}, {"temperature": "미지근하지만 살짝 식는 중이에요. 공포지수(VIX 17.2)는 아직 평온하지만, 신용 스프레드가 한 달 새 3.08%p에서 3.26%p로 벌어졌고 물가도 3.4%에서 3.7%로 다시 올랐어요. 시장 전체는 싸지 않은데 방어주(SCHD 1년 +33.8%, 52주 최고)까지 비싸졌어요. 겁낼 때는 아니고, 조심할 때예요.", "exposure": "이번 주 주문은 드러켄밀러의 SCHD 15,000원 하나뿐이에요. 들어가면 버핏과 드러켄밀러가 각각 따로 보유한 BRK-B(합산 19.8%)에 SCHD를 더해 네 운용 중 두 명이 '튼튼한 가치·배당주'라는 같은 방향에 몰려요. 원자재 PDBC도 달리오와 드러켄밀러가 겹쳐 들고 있어요. 한 종목으로는 실리콘투(15.8%)가 가장 큰데, 린치 한 명만 보유하고 1개월 -25.6%로 출렁임이 커서 눈여겨볼 만해요.", "warnings": ["드러켄밀러의 SCHD 주문 근거 중 1개월 +9.6%, 52주 위치 100%, 변동성 11.5%는 팩트 시트와 같아요. 다만 비교 대상으로 든 QQQ 변동성 20.3%는 팩트 시트에 없는 숫자라 확인이 필요해요. 주문의 핵심 근거는 아니어서 거부하지는 않아요.", "SCHD는 1년에 +33.8% 올라 52주 최고가에 있어요. '방어주로 피신'이 이미 많은 사람이 한 선택이라 그만큼 가격에 반영됐을 수 있어요. 추세가 꺾이면 방어주라도 떨어질 수 있다는 점을 알아 두세요.", "버핏 BRK-B와 드러켄밀러 BRK-B·SCHD가 같은 '가치·방어' 쪽에 쏠려 있어요. 이 흐름이 뒤집히면(예: 기술주 반등) 두 운용이 함께 뒤처질 수 있어요.", "채점 확인 필요: 버핏의 1023-5와 달리오의 1022-2는 '맞음'으로 채점됐는데, 원래 가설과 판별 기준이 브리프에 없어서 제대로 맞았는지 확인할 수 없어요. 기준을 같이 적어 주세요.", "주문은 아니지만 관점에 나온 숫자 중 팩트 시트에 없는 것들 for (const k of ids){ const a=D.agents[k], n=a.notes[a.notes.length-1];
  h += `<section class="card"><div class="row"><h2>${dot(k)}${esc(a.name)}</h2><span class="note num">현금 ${fmt(a.cash)}원</span></div>`;
  if (n) h += `<p><b>${esc(n.note)}</b></p><details><summary>이 에이전트가 시장을 보는 눈</summary><p class="sub" style="margin-top:8px">${esc(n.view)}</p></details>`;
  h += a.pos.length?`<div class="pos">`+a.pos.map(p=>{const over=k!=="bogle"&&p.w>40; return `<div class="row"><span>${esc(p.sym)} <small class="${over?"warn":"sub"}">${p.w}%${over?" · 40% 넘음":""}</small></span><span class="num">${fmt(p.v)}원 <span class="${cls(p.ret)}">${pct(p.ret)}</span></span></div>`}).join("")+`</div>`:`<p class="note">아직 산 것 없음</p>`;
  const lines=[]; for (const [s_,v] of Object.entries(a.stops||{})) lines.push(`${esc(s_)} 손절 ${v}%`); for (const [s_,v] of Object.entries(a.takes||{})) lines.push(`${esc(s_)} 익절 +${v.pct}%에 ${Math.round(v.frac*100)}%`);
  if (lines.length && k!=="bogle") h += `<p class="note">${lines.join(" · ")}</p>`;
  if (a.score) h += `<p class="note">성적: ${esc(a.score)}</p>`;
  if (a.tests?.length) h += `<div class="in"><h4>숫자로 채점하는 가설</h4><div style="margin-top:8px">` + a.tests.slice().reverse().map(t=>{
    const g=t.prog; let pill, sub;
    if (t.status) { pill=`<span class="chip ${t.status==="맞음"?"ok":"bad"}">${t.status}</span>`; sub=esc(t.evidence); }
    else if (g) { pill=`<span class="chip ${g.ok?"ok":"bad"}">${g.ok?"맞는 중":"틀리는 중"}</span>`; sub=`${esc(g.desc)} · 기준 ${esc(g.goal)} · ${g.by}까지 ${g.left}일`; }
    else { pill=`<span class="chip">대기</span>`; sub="지금 값 조회 실패"; }
    return `<div class="test"><div class="row"><span>${esc(t.claim)}</span>${pill}</div><p class="note">확신 ${t.conf??"?"}% · ${sub}</p></div>`}).join("") + `</div></div>`;
  if (n?.concentration?.length) h += `<p class="note">비중 판단: ${n.concentration.map(c=>`<b>${esc(c.sym)} ${({keep:"유지",trim:"줄임",sell:"매도"})[c.action]||esc(c.action)}</b> — ${esc(c.reason)}`).join(" / ")}</p>`;
  if (n?.trimmed?.length) h += `<p class="note">자동 축소: ${n.trimmed.map(esc).join(", ")}</p>`;
  if (n?.hypotheses?.length) h += `<details><summary>이번 주 가설과 판별 기준</summary><ul class="list">${n.hypotheses.map(x=>`<li><b>${esc(x.claim)}</b><br><span class="note">확인: ${esc(x.check)} · 접을 때: ${esc(x.kill)}</span></li>`).join("")}</ul></details>`;
  if (a.trades.length) h += `<details><summary>매매 기록 ${a.trades.length}건</summary><ul class="list">${a.trades.slice().reverse().map(t=>`<li class="note">${t.date} ${t.side==="buy"?"매수":"매도"} ${esc(t.sym)} ${fmt(t.krw)}원 — ${esc(t.reason)}</li>`).join("")}</ul></details>`;
  h += `</section>`; }
document.getElementById("app").innerHTML = h;
</script></body></html>
